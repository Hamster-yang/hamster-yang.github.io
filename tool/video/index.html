<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影片編輯器 - Hamsteryang Tools</title>
    <link rel="icon" type="image/x-icon" href="../../assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../css/macos.css">
    <style>
        /* Video Editor Window */
        .video-window {
            position: fixed;
            top: 30px;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--window-bg);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            z-index: 9000;
            will-change: transform;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            contain: layout style paint;
        }

        .video-header {
            height: 50px;
            background: var(--window-header-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .window-control-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .window-control-btn.close {
            background: #ff5f56;
        }

        .window-control-btn.close:hover {
            background: #ff4136;
        }

        .video-header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-color);
        }

        .video-header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-main);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #0070d6;
        }

        .btn-success {
            background: #27c93f;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #1fb535;
        }

        .btn-danger {
            background: #ff5f56;
            color: white;
        }

        .video-content {
            flex: 1;
            display: grid;
            grid-template-columns: 320px 1fr;
            overflow: hidden;
        }

        /* Clips Sidebar */
        .clips-sidebar {
            background: rgba(30, 30, 30, 0.85);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .clip-count {
            font-size: 12px;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 12px;
            color: var(--text-color);
        }

        .clips-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .clips-list::-webkit-scrollbar {
            width: 6px;
        }

        .clips-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .clips-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .clip-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }

        .clip-card:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-color);
        }

        .clip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .clip-name {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-color);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .clip-index {
            background: var(--accent-color);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            margin-right: 8px;
        }

        .clip-actions {
            display: flex;
            gap: 4px;
        }

        .clip-action-btn {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: white;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.1);
        }

        .clip-action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .clip-input-group {
            margin-bottom: 10px;
        }

        .clip-input-label {
            font-size: 10px;
            color: #888;
            margin-bottom: 4px;
            display: block;
        }

        .clip-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 6px 8px;
            color: white;
            font-size: 12px;
            outline: none;
        }

        .clip-input:focus {
            border-color: var(--accent-color);
        }

        .clip-inputs-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .transition-select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 6px 8px;
            color: white;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        .transition-select:focus {
            border-color: var(--accent-color);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* Preview Area */
        .preview-area {
            display: flex;
            flex-direction: column;
            background: rgba(20, 20, 20, 0.9);
        }

        .preview-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        #preview-canvas {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
        }

        .preview-controls {
            height: 80px;
            background: var(--window-header-bg);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            padding: 0 30px;
            gap: 20px;
        }

        .play-controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            transition: all 0.2s;
        }

        .control-btn.play {
            background: var(--accent-color);
        }

        .control-btn.play:hover {
            background: #0070d6;
            transform: scale(1.05);
        }

        .control-btn.loop {
            background: rgba(255, 255, 255, 0.1);
        }

        .control-btn.loop:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .control-btn.loop.active {
            background: var(--accent-color);
        }

        .time-progress {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .progress-bar-container {
            width: 100%;
            height: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, var(--accent-color), #0070d6);
            border-radius: 6px;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-family: monospace;
            color: #888;
        }

        .time-current {
            color: var(--accent-color);
        }

        /* Loading */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 11000;
        }

        #loading-overlay.active {
            display: flex;
        }

        .loading-content {
            background: var(--window-bg);
            backdrop-filter: var(--glass-blur);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--window-header-bg);
            backdrop-filter: var(--glass-blur);
            color: white;
            padding: 12px 24px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 12000;
        }

        #toast.show {
            opacity: 1;
        }

        /* Hidden video container */
        #video-source-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: -50;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div class="desktop">

        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="apple-logo"><i class="bi bi-apple"></i></div>
                <div class="menu-item" style="font-weight: bold;">Video Editor</div>
                <div class="menu-item hide-on-mobile">File</div>
                <div class="menu-item hide-on-mobile">Edit</div>
                <div class="menu-item hide-on-mobile">View</div>
            </div>
            <div class="top-bar-right">
                <div class="menu-item"><i class="bi bi-battery-full"></i></div>
                <div class="menu-item"><i class="bi bi-wifi"></i></div>
                <div class="menu-item"><i class="bi bi-search"></i></div>
                <div class="menu-item" id="clock">Mon Jun 22 9:41 AM</div>
            </div>
        </div>

        <!-- Video Editor Window -->
        <div class="video-window">
            <div class="video-header">
                <div class="window-controls">
                    <a href="../../index.html" class="window-control-btn close" title="關閉"></a>
                    <div class="window-control-btn" style="background: #ffbd2e; cursor: default;"></div>
                    <div class="window-control-btn" style="background: #27c93f; cursor: default;"></div>
                </div>
                <span class="video-header-title">影片編輯器</span>
                <div class="video-header-actions">
                    <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
                        <i class="bi bi-upload"></i>
                        <span>匯入</span>
                    </button>
                    <button class="btn btn-success" id="export-btn" disabled onclick="startExport()">
                        <i class="bi bi-download"></i>
                        <span>匯出</span>
                    </button>
                </div>
            </div>

            <div class="video-content">
                <!-- Clips Sidebar -->
                <div class="clips-sidebar">
                    <div class="sidebar-header">
                        <h3>
                            <i class="bi bi-film"></i>
                            片段列表
                        </h3>
                        <span class="clip-count" id="clip-count">0</span>
                    </div>
                    <div class="clips-list" id="clips-list">
                        <div class="empty-state" id="empty-state">
                            <i class="bi bi-film"></i>
                            <p>尚無片段</p>
                            <p style="font-size: 11px; margin-top: 5px;">點擊上方按鈕匯入影片</p>
                        </div>
                    </div>
                    <div style="padding: 12px; border-top: 1px solid rgba(255, 255, 255, 0.1);">
                        <button class="btn btn-danger" style="width: 100%; justify-content: center; font-size: 12px;"
                            id="clear-all-btn">
                            <i class="bi bi-trash"></i>
                            <span>清空全部</span>
                        </button>
                    </div>
                </div>

                <!-- Preview Area -->
                <div class="preview-area">
                    <div class="preview-container">
                        <canvas id="preview-canvas" width="1280" height="720"></canvas>
                    </div>
                    <div class="preview-controls">
                        <div class="play-controls">
                            <button class="control-btn play" id="play-pause-btn">
                                <i class="bi bi-play-fill"></i>
                            </button>
                            <button class="control-btn loop" id="loop-btn" title="重複播放">
                                <i class="bi bi-repeat"></i>
                            </button>
                        </div>
                        <div class="time-progress">
                            <div class="progress-bar-container" id="progress-bar-container">
                                <div class="progress-bar" id="progress-bar"></div>
                            </div>
                            <div class="time-display">
                                <span class="time-current" id="current-time">00:00.0</span>
                                <span id="total-time">00:00.0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Hidden file input -->
        <input type="file" id="file-input" multiple accept="video/*" style="display: none;">

        <!-- Hidden video container -->
        <div id="video-source-container"></div>

        <!-- Loading Overlay -->
        <div id="loading-overlay">
            <div class="loading-content">
                <div class="loading-spinner"></div>
                <p id="loading-text" style="color: white;">處理中...</p>
            </div>
        </div>

        <!-- Toast -->
        <div id="toast"></div>
    </div>

    <script src="../../js/macos.js"></script>
    <script>


        // --- State Management ---
        const state = {
            clips: [],
            isPlaying: false,
            isLooping: false,
            currentTime: 0,
            totalDuration: 0,
            isExporting: false,
            animationFrameId: null,
            lastFrameTime: 0
        };

        // --- DOM Elements ---
        const elements = {
            fileInput: document.getElementById('file-input'),
            clipsList: document.getElementById('clips-list'),
            emptyState: document.getElementById('empty-state'),
            clipCount: document.getElementById('clip-count'),
            canvas: document.getElementById('preview-canvas'),
            ctx: document.getElementById('preview-canvas').getContext('2d'),
            videoContainer: document.getElementById('video-source-container'),
            playPauseBtn: document.getElementById('play-pause-btn'),
            loopBtn: document.getElementById('loop-btn'),
            exportBtn: document.getElementById('export-btn'),
            clearAllBtn: document.getElementById('clear-all-btn'),
            currentTimeDisplay: document.getElementById('current-time'),
            totalTimeDisplay: document.getElementById('total-time'),
            progressBar: document.getElementById('progress-bar'),
            loadingOverlay: document.getElementById('loading-overlay')
        };

        // --- Audio Context ---
        let audioCtx, audioDest;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                audioDest = audioCtx.createMediaStreamDestination();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        const formatTime = (seconds) => {
            if (isNaN(seconds)) return "00:00.0";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            const ms = Math.floor((seconds % 1) * 10);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${ms}`;
        };

        function updateTotalDuration() {
            state.totalDuration = state.clips.reduce((acc, clip) => acc + (clip.end - clip.start), 0);
            elements.totalTimeDisplay.textContent = formatTime(state.totalDuration);
            elements.exportBtn.disabled = state.clips.length === 0;
            elements.clipCount.textContent = state.clips.length;
            elements.emptyState.style.display = state.clips.length === 0 ? 'block' : 'none';
        }

        function renderClipsList() {
            const cards = elements.clipsList.querySelectorAll('.clip-card');
            cards.forEach(c => c.remove());

            state.clips.forEach((clip, index) => {
                const card = document.createElement('div');
                card.className = 'clip-card';
                card.innerHTML = `
                    <div class="clip-header">
                        <span class="clip-index">#${index + 1}</span>
                        <span class="clip-name" title="${clip.name}">${clip.name}</span>
                        <div class="clip-actions">
                            <button class="clip-action-btn move-up" title="上移">
                                <i class="bi bi-arrow-up"></i>
                            </button>
                            <button class="clip-action-btn move-down" title="下移">
                                <i class="bi bi-arrow-down"></i>
                            </button>
                            <button class="clip-action-btn delete" title="刪除" style="color: #ff5f56;">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="clip-input-group">
                        <label class="clip-input-label">剪取範圍 (秒)</label>
                        <div class="clip-inputs-row">
                            <input type="number" class="clip-input start-input" value="${clip.start.toFixed(1)}" min="0" max="${clip.duration}" step="0.1" placeholder="開始">
                            <input type="number" class="clip-input end-input" value="${clip.end.toFixed(1)}" min="0" max="${clip.duration}" step="0.1" placeholder="結束">
                        </div>
                    </div>
                    <div class="clip-input-group">
                        <label class="clip-input-label">換場特效</label>
                        <select class="transition-select">
                            <option value="none" ${clip.transition === 'none' ? 'selected' : ''}>無 (直切)</option>
                            <option value="fade_in" ${clip.transition === 'fade_in' ? 'selected' : ''}>淡入</option>
                            <option value="fade_out" ${clip.transition === 'fade_out' ? 'selected' : ''}>淡出</option>
                            <option value="both" ${clip.transition === 'both' ? 'selected' : ''}>淡入 + 淡出</option>
                        </select>
                    </div>
                `;

                card.querySelector('.start-input').addEventListener('change', (e) => {
                    let val = parseFloat(e.target.value);
                    if (val < 0) val = 0;
                    if (val >= clip.end) val = clip.end - 0.1;
                    clip.start = val;
                    e.target.value = val.toFixed(1);
                    updateTotalDuration();
                });

                card.querySelector('.end-input').addEventListener('change', (e) => {
                    let val = parseFloat(e.target.value);
                    if (val > clip.duration) val = clip.duration;
                    if (val <= clip.start) val = clip.start + 0.1;
                    clip.end = val;
                    e.target.value = val.toFixed(1);
                    updateTotalDuration();
                });

                card.querySelector('.transition-select').addEventListener('change', (e) => {
                    clip.transition = e.target.value;
                });

                card.querySelector('.move-up').addEventListener('click', () => moveClip(index, -1));
                card.querySelector('.move-down').addEventListener('click', () => moveClip(index, 1));
                card.querySelector('.delete').addEventListener('click', () => deleteClip(index));

                elements.clipsList.appendChild(card);
            });

            updateTotalDuration();
        }

        function moveClip(index, direction) {
            if (index + direction < 0 || index + direction >= state.clips.length) return;
            const temp = state.clips[index];
            state.clips[index] = state.clips[index + direction];
            state.clips[index + direction] = temp;
            renderClipsList();
        }

        function deleteClip(index) {
            const clip = state.clips[index];
            if (clip.videoElement) {
                clip.videoElement.pause();
                clip.videoElement.removeAttribute('src');
                clip.videoElement.load();
                clip.videoElement.remove();
            }
            state.clips.splice(index, 1);
            renderClipsList();
        }

        elements.clearAllBtn.addEventListener('click', () => {
            if (state.clips.length === 0) return;
            if (!confirm('確定要清空所有片段嗎？')) return;

            state.clips.forEach(c => {
                if (c.videoElement) {
                    c.videoElement.pause();
                    c.videoElement.removeAttribute('src');
                    c.videoElement.load();
                    c.videoElement.remove();
                }
            });
            state.clips = [];
            stopPlayback();
            state.currentTime = 0;
            state.totalDuration = 0;
            elements.currentTimeDisplay.textContent = "00:00.0";
            elements.totalTimeDisplay.textContent = "00:00.0";
            elements.progressBar.style.width = "0%";
            elements.ctx.clearRect(0, 0, elements.canvas.width, elements.canvas.height);
            renderClipsList();
        });

        elements.fileInput.addEventListener('change', (e) => {
            initAudio();
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            showLoading('載入影片...');

            let loadedCount = 0;
            files.forEach(file => {
                const url = URL.createObjectURL(file);
                const video = document.createElement('video');
                video.src = url;
                video.crossOrigin = "anonymous";
                video.preload = "auto";
                video.muted = false;
                elements.videoContainer.appendChild(video);

                video.onloadedmetadata = () => {
                    const clip = {
                        id: crypto.randomUUID(),
                        url: url,
                        name: file.name,
                        duration: video.duration,
                        start: 0,
                        end: video.duration,
                        transition: 'none',
                        videoElement: video,
                        audioSource: null
                    };

                    try {
                        const source = audioCtx.createMediaElementSource(video);
                        source.connect(audioDest);
                        source.connect(audioCtx.destination);
                        clip.audioSource = source;
                    } catch (err) {
                        // Ignore
                    }

                    state.clips.push(clip);

                    loadedCount++;
                    if (loadedCount === files.length) {
                        hideLoading();
                        renderClipsList();
                    }
                };

                video.onerror = () => {
                    console.error("Video load error", file.name);
                    loadedCount++;
                    if (loadedCount === files.length) hideLoading();
                };
            });
            elements.fileInput.value = '';
        });

        function drawFrame() {
            const { ctx, canvas } = elements;

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let timeCursor = 0;
            let activeClipDrawn = false;

            for (let clip of state.clips) {
                const clipDuration = clip.end - clip.start;
                const videoEl = clip.videoElement;

                if (state.currentTime >= timeCursor && state.currentTime < timeCursor + clipDuration) {
                    activeClipDrawn = true;

                    if (videoEl.readyState >= 2) {
                        const relativeTime = state.currentTime - timeCursor + clip.start;
                        const diff = Math.abs(videoEl.currentTime - relativeTime);

                        if (diff > 0.3) {
                            videoEl.currentTime = relativeTime;
                        }

                        if (state.isPlaying && videoEl.paused) {
                            const playPromise = videoEl.play();
                            if (playPromise) playPromise.catch(() => { });
                        } else if (!state.isPlaying && !videoEl.paused) {
                            videoEl.pause();
                        }

                        const scale = Math.min(canvas.width / videoEl.videoWidth, canvas.height / videoEl.videoHeight);
                        const w = videoEl.videoWidth * scale;
                        const h = videoEl.videoHeight * scale;
                        const x = (canvas.width - w) / 2;
                        const y = (canvas.height - h) / 2;

                        ctx.save();

                        let alpha = 1.0;
                        const fadeDuration = 1.0;
                        const timeInClip = state.currentTime - timeCursor;
                        const timeUntilEnd = (timeCursor + clipDuration) - state.currentTime;

                        if ((clip.transition === 'fade_in' || clip.transition === 'both') && timeInClip < fadeDuration) {
                            alpha = timeInClip / fadeDuration;
                        }
                        if ((clip.transition === 'fade_out' || clip.transition === 'both') && timeUntilEnd < fadeDuration) {
                            alpha = timeUntilEnd / fadeDuration;
                        }

                        ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
                        ctx.drawImage(videoEl, x, y, w, h);
                        ctx.restore();
                    }
                } else {
                    if (!videoEl.paused) videoEl.pause();
                }

                timeCursor += clipDuration;
            }

            if (!activeClipDrawn && state.clips.length > 0) {
                state.clips.forEach(c => !c.videoElement.paused && c.videoElement.pause());
            }

            elements.currentTimeDisplay.textContent = formatTime(state.currentTime);
            const progressPercent = state.totalDuration > 0 ? (state.currentTime / state.totalDuration) * 100 : 0;
            elements.progressBar.style.width = `${progressPercent}%`;

            if (state.isPlaying) {
                if (state.currentTime >= state.totalDuration) {
                    if (state.isExporting) {
                        setTimeout(stopExport, 100);
                    } else if (state.isLooping) {
                        state.currentTime = 0;
                        state.animationFrameId = requestAnimationFrame(drawFrame);
                    } else {
                        stopPlayback();
                    }
                } else {
                    const now = performance.now();
                    const dt = (now - state.lastFrameTime) / 1000;
                    state.lastFrameTime = now;
                    state.currentTime += Math.min(dt, 0.1);
                    state.animationFrameId = requestAnimationFrame(drawFrame);
                }
            }
        }

        function startPlayback() {
            if (state.clips.length === 0) return;
            initAudio();
            state.isPlaying = true;
            state.lastFrameTime = performance.now();

            elements.playPauseBtn.innerHTML = `<i class="bi bi-pause-fill"></i>`;

            if (state.currentTime >= state.totalDuration) {
                state.currentTime = 0;
            }

            drawFrame();
        }

        function stopPlayback() {
            state.isPlaying = false;
            cancelAnimationFrame(state.animationFrameId);
            state.clips.forEach(c => c.videoElement.pause());
            elements.playPauseBtn.innerHTML = `<i class="bi bi-play-fill"></i>`;
        }

        elements.playPauseBtn.addEventListener('click', () => {
            if (state.isPlaying) stopPlayback();
            else startPlayback();
        });

        elements.loopBtn.addEventListener('click', () => {
            state.isLooping = !state.isLooping;
            elements.loopBtn.classList.toggle('active', state.isLooping);
        });

        let mediaRecorder, recordedChunks = [];

        function startExport() {
            if (state.isExporting || state.clips.length === 0) return;

            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            state.isExporting = true;
            state.currentTime = 0;

            elements.exportBtn.innerHTML = `<span>處理中...</span>`;
            elements.exportBtn.classList.add('btn-danger');
            elements.exportBtn.classList.remove('btn-success');

            const stream = elements.canvas.captureStream(30);

            if (audioDest) {
                const audioTracks = audioDest.stream.getAudioTracks();
                if (audioTracks.length > 0) stream.addTrack(audioTracks[0]);
            }

            recordedChunks = [];
            let options = { mimeType: 'video/webm; codecs=vp9' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/webm; codecs=vp8' };
            }

            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                showToast("瀏覽器不支援此錄製格式");
                stopExport();
                return;
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                if (blob.size === 0) {
                    showToast("匯出失敗");
                } else {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `video_${Date.now()}.webm`;
                    a.click();
                    showToast("匯出完成！");
                }

                state.isExporting = false;
                elements.exportBtn.innerHTML = `<i class="bi bi-download"></i><span>匯出</span>`;
                elements.exportBtn.classList.remove('btn-danger');
                elements.exportBtn.classList.add('btn-success');
            };

            mediaRecorder.start();
            startPlayback();
        }

        function stopExport() {
            stopPlayback();
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            } else {
                state.isExporting = false;
                elements.exportBtn.innerHTML = `<i class="bi bi-download"></i><span>匯出</span>`;
                elements.exportBtn.classList.remove('btn-danger');
                elements.exportBtn.classList.add('btn-success');
            }
            state.currentTime = 0;
            setTimeout(() => drawFrame(), 200);
        }

        document.getElementById('progress-bar-container').addEventListener('click', (e) => {
            if (state.totalDuration === 0) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const percent = Math.max(0, Math.min(1, x / rect.width));
            state.currentTime = percent * state.totalDuration;
            if (!state.isPlaying) requestAnimationFrame(drawFrame);
        });

        function showLoading(text) {
            document.getElementById('loading-text').textContent = text;
            elements.loadingOverlay.classList.add('active');
        }

        function hideLoading() {
            elements.loadingOverlay.classList.remove('active');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
