<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101114">
    <meta name="description" content="Hamster Yang 的倒數計時器工具，可調整顏色、顯示大小、位置並切換全螢幕。">
    <title>倒數計時器 — Hamster Yang Tools</title>
    <link rel="icon" href="../../assets/favicon.ico" sizes="any">
    <link rel="stylesheet" href="../../css/tools.css?v=20261110b">
    <link rel="stylesheet" href="../time/css/time.css?v=20261110c">
    <link rel="stylesheet" href="css/clock.css?v=20261110b">
    <script src="../../js/tools.js?v=20261110b" defer></script>
    <script src="../../js/clock-face.js?v=20261110c" defer></script>
    <script src="js/clock.js?v=20261110b" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">跳至倒數計時器</a>
    <header class="top-bar"><nav class="top-bar-left" aria-label="工具導覽"><a class="apple-logo" href="../../index.html" aria-label="Hamster Yang 桌面">hy.</a><span class="menu-item app-name">Countdown</span><a class="menu-item" href="../../index.html">返回桌面</a><a class="menu-item" href="../../projects.html">所有工具</a></nav><div class="top-bar-right"><time id="clock" aria-label="現在時間"></time></div></header>
    <main class="clock-window" id="main" aria-labelledby="tool-title">
        <div class="clock-header">
            <div class="window-controls"><a href="../../index.html" class="window-control-btn close" aria-label="關閉倒數計時器並返回桌面" title="返回桌面"></a><span class="window-control-btn inactive" aria-hidden="true"></span><span class="window-control-btn inactive" aria-hidden="true"></span></div>
            <h1 id="tool-title" class="clock-tool-title">倒數計時器</h1>
            <div class="clock-header-actions"><button class="btn" type="button" id="fullscreen-btn" aria-pressed="false" hidden>全螢幕</button><button class="btn" type="button" id="settings-btn" aria-expanded="false" aria-controls="settings-panel">設定</button></div>
        </div>
        <div class="clock-content">
            <div id="timer-display" class="clock-face" tabindex="0" role="timer" aria-live="off" aria-label="剩餘時間" aria-describedby="display-help">00:05:00</div>
            <aside class="settings-panel" id="settings-panel" aria-labelledby="settings-title" hidden>
                <div class="settings-heading"><h2 id="settings-title">設定</h2><button type="button" class="btn" data-close-settings aria-label="關閉設定">關閉</button></div>
                <fieldset class="setting-group"><legend>倒數時間</legend><div class="time-inputs"><div><label for="hours-input">時</label><input type="number" id="hours-input" min="0" max="23" step="1" value="0" inputmode="numeric"></div><div><label for="minutes-input">分</label><input type="number" id="minutes-input" min="0" max="59" step="1" value="5" inputmode="numeric"></div><div><label for="seconds-input">秒</label><input type="number" id="seconds-input" min="0" max="59" step="1" value="0" inputmode="numeric"></div></div><p class="setting-note">計時中鎖定時間；暫停後調整會重新設定倒數。</p></fieldset>
                    <fieldset class="setting-group"><legend>快速設定</legend><div class="preset-buttons"><button type="button" class="preset-btn" data-seconds="60">1 分鐘</button><button type="button" class="preset-btn" data-seconds="300">5 分鐘</button><button type="button" class="preset-btn" data-seconds="600">10 分鐘</button><button type="button" class="preset-btn" data-seconds="900">15 分鐘</button><button type="button" class="preset-btn" data-seconds="1800">30 分鐘</button><button type="button" class="preset-btn" data-seconds="3600">1 小時</button></div></fieldset>
                <div class="setting-group"><label for="font-scale-slider">顯示大小</label><div class="slider-container"><input type="range" id="font-scale-slider" min="25" max="100" value="80" step="1"><output id="font-scale-value" for="font-scale-slider">80%</output></div><p class="setting-note">依可用畫面縮放，完整保留所有數字。</p></div>
                    <fieldset class="setting-group"><legend>文字顏色</legend><div class="theme-buttons"><button type="button" class="theme-btn" data-color="#a7c995" aria-pressed="true">柔綠</button><button type="button" class="theme-btn" data-color="#ffffff" aria-pressed="false">白色</button><button type="button" class="theme-btn" data-color="#000000" aria-pressed="false">黑色</button><button type="button" class="theme-btn" data-color="#0a84ff" aria-pressed="false">藍色</button><button type="button" class="theme-btn" data-color="#ff9500" aria-pressed="false">橙色</button><button type="button" class="theme-btn" data-color="#ff5f56" aria-pressed="false">紅色</button><button type="button" class="theme-btn" data-color="#ffbd2e" aria-pressed="false">黃色</button><button type="button" class="theme-btn" data-color="#a371f7" aria-pressed="false">紫色</button></div></fieldset>
                    <fieldset class="setting-group"><legend>背景顏色</legend><div class="bg-buttons"><button type="button" class="bg-btn" data-bg="#101114" aria-pressed="true">深灰</button><button type="button" class="bg-btn" data-bg="#000000" aria-pressed="false">黑色</button><button type="button" class="bg-btn" data-bg="#ffffff" aria-pressed="false">白色</button><button type="button" class="bg-btn" data-bg="#0a2540" aria-pressed="false">深藍</button><button type="button" class="bg-btn" data-bg="#1a3a1a" aria-pressed="false">深綠</button><button type="button" class="bg-btn" data-bg="#3a1a1a" aria-pressed="false">深紅</button></div></fieldset>
                    <div class="setting-group"><button class="btn" type="button" id="position-reset-btn">置中並重設大小</button></div>
                <fieldset class="setting-group"><legend>結束提示</legend><label class="checkbox-label" for="sound-checkbox"><input type="checkbox" id="sound-checkbox" checked>結束時播放提示音</label><button type="button" class="btn" id="sound-test-btn">測試提示音</button><p class="setting-note" id="sound-status" role="status">請先測試音量。裝置靜音、休眠或瀏覽器限制可能影響提示音。</p></fieldset>
            </aside>
        </div>
        <div class="clock-toolbar"><div class="timer-controls"><button type="button" class="btn btn-primary" id="start-btn">開始</button><button type="button" class="btn btn-primary" id="pause-btn" hidden>暫停</button><button type="button" class="btn" id="reset-btn">重設</button><span id="timer-status" role="status">準備就緒</span></div><p id="display-help">拖曳調整位置 · 方向鍵移動 · Home 置中</p></div>
        <p class="display-status" id="display-status" role="status"></p>
        <div class="fullscreen-controls" aria-label="全螢幕操作" hidden><button type="button" class="btn btn-primary" data-clock-target="start-btn">開始</button><button type="button" class="btn btn-primary" data-clock-target="pause-btn" hidden>暫停</button><button type="button" class="btn" data-clock-target="reset-btn">重設</button><button type="button" class="btn" data-exit-fullscreen>離開全螢幕 <span aria-hidden="true">⤢</span></button></div>
        <noscript><p class="noscript-note">請啟用 JavaScript 以使用倒數計時器。</p></noscript>
    </main>
</body>
</html>
