<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒數計時器 - Hamsteryang Tools</title>
    <link rel="icon" type="image/x-icon" href="../../assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../css/macos.css">
    <link rel="stylesheet" href="css/clock.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="desktop">

        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="apple-logo"><i class="bi bi-apple"></i></div>
                <div class="menu-item" style="font-weight: bold;">Countdown</div>
                <div class="menu-item hide-on-mobile">File</div>
                <div class="menu-item hide-on-mobile">Edit</div>
                <div class="menu-item hide-on-mobile">View</div>
            </div>
            <div class="top-bar-right">
                <div class="menu-item"><i class="bi bi-battery-full"></i></div>
                <div class="menu-item"><i class="bi bi-wifi"></i></div>
                <div class="menu-item"><i class="bi bi-search"></i></div>
                <div class="menu-item" id="clock">Mon Jun 22 9:41 AM</div>
            </div>
        </div>

        <!-- Clock Window -->
        <div class="clock-window">
            <div class="clock-header">
                <div class="window-controls">
                    <a href="../../index.html" class="window-control-btn close" title="關閉"></a>
                    <div class="window-control-btn" style="background: #ffbd2e; cursor: default;"></div>
                    <div class="window-control-btn" style="background: #27c93f; cursor: default;"></div>
                </div>
                <span class="clock-header-title">倒數計時器</span>
                <div class="clock-header-actions">
                    <button class="btn btn-icon" id="settings-btn" title="設定">
                        <i class="bi bi-gear"></i>
                    </button>
                </div>
            </div>

            <div class="clock-content">
                <!-- Timer Display -->
                <div id="timer-display">00:00:00</div>

                <!-- Settings Panel -->
                <div class="settings-panel" id="settings-panel">
                    <div class="setting-group">
                        <label>控制</label>
                        <div class="control-buttons">
                            <button class="control-btn-inline" id="start-btn">
                                <i class="bi bi-play-fill"></i>
                                開始
                            </button>
                            <button class="control-btn-inline" id="pause-btn" style="display: none;">
                                <i class="bi bi-pause-fill"></i>
                                暫停
                            </button>
                            <button class="control-btn-inline reset" id="reset-btn">
                                <i class="bi bi-arrow-clockwise"></i>
                                重置
                            </button>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label>設定時間</label>
                        <div class="time-inputs">
                            <div class="time-input-group">
                                <input type="number" id="hours-input" min="0" max="23" value="0" placeholder="時">
                                <span>時</span>
                            </div>
                            <div class="time-input-group">
                                <input type="number" id="minutes-input" min="0" max="59" value="5" placeholder="分">
                                <span>分</span>
                            </div>
                            <div class="time-input-group">
                                <input type="number" id="seconds-input" min="0" max="59" value="0" placeholder="秒">
                                <span>秒</span>
                            </div>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label>快速設定</label>
                        <div class="preset-buttons">
                            <button class="preset-btn" data-seconds="60">1 分鐘</button>
                            <button class="preset-btn" data-seconds="300">5 分鐘</button>
                            <button class="preset-btn" data-seconds="600">10 分鐘</button>
                            <button class="preset-btn" data-seconds="900">15 分鐘</button>
                            <button class="preset-btn" data-seconds="1800">30 分鐘</button>
                            <button class="preset-btn" data-seconds="3600">1 小時</button>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label>字體縮放倍率</label>
                        <div class="slider-container">
                            <input type="range" id="font-scale-slider" min="0.1" max="20" value="1" step="0.1">
                            <span id="font-scale-value">1.0x</span>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label>文字顏色</label>
                        <div class="theme-buttons">
                            <button class="theme-btn" data-color="#ff9500">橙色</button>
                            <button class="theme-btn" data-color="#ff5f56">紅色</button>
                            <button class="theme-btn active" data-color="#0a84ff">藍色</button>
                            <button class="theme-btn" data-color="#27c93f">綠色</button>
                            <button class="theme-btn" data-color="#a371f7">紫色</button>
                            <button class="theme-btn" data-color="#ffffff">白色</button>
                            <button class="theme-btn" data-color="#000000">黑色</button>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label>背景顏色</label>
                        <div class="bg-buttons">
                            <button class="bg-btn active" data-bg="#1a1a1a">深灰</button>
                            <button class="bg-btn" data-bg="#000000">黑色</button>
                            <button class="bg-btn" data-bg="#ffffff">白色</button>
                            <button class="bg-btn" data-bg="#0a2540">深藍</button>
                            <button class="bg-btn" data-bg="#1a3a1a">深綠</button>
                            <button class="bg-btn" data-bg="#3a1a1a">深紅</button>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="sound-checkbox" checked>
                            <span>結束時播放提示音</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/macos.js"></script>
    <script src="js/clock.js"></script>
</body>

</html>
