<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時鐘 - Hamsteryang Tools</title>
    <link rel="icon" type="image/x-icon" href="../../assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../css/macos.css">
    <link rel="stylesheet" href="css/time.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="desktop">

        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="apple-logo"><i class="bi bi-apple"></i></div>
                <div class="menu-item" style="font-weight: bold;">Time</div>
                <div class="menu-item hide-on-mobile">File</div>
                <div class="menu-item hide-on-mobile">Edit</div>
                <div class="menu-item hide-on-mobile">View</div>
            </div>
            <div class="top-bar-right">
                <div class="menu-item"><i class="bi bi-battery-full"></i></div>
                <div class="menu-item"><i class="bi bi-wifi"></i></div>
                <div class="menu-item"><i class="bi bi-search"></i></div>
                <div class="menu-item" id="clock">Mon Jun 22 9:41 AM</div>
            </div>
        </div>

        <!-- Time Window -->
        <div class="time-window">
            <div class="time-header">
                <div class="window-controls">
                    <a href="../../index.html" class="window-control-btn close" title="關閉"></a>
                    <div class="window-control-btn" style="background: #ffbd2e; cursor: default;"></div>
                    <div class="window-control-btn" style="background: #27c93f; cursor: default;"></div>
                </div>
                <span class="time-header-title">時鐘</span>
                <div class="time-header-actions">
                    <button class="btn btn-icon" id="settings-btn" title="設定">
                        <i class="bi bi-gear"></i>
                    </button>
                </div>
            </div>

            <div class="time-content">
                <div id="clock-display">00:00:00</div>

                <!-- Settings Panel -->
                <div class="settings-panel" id="settings-panel">
                    <div class="setting-group">
                        <label>字體縮放倍率</label>
                        <div class="slider-container">
                            <input type="range" id="font-scale-slider" min="0.1" max="20" value="1" step="0.1">
                            <span id="font-scale-value">1.0x</span>
                        </div>
                    </div>
                    <div class="setting-group">
                        <label>文字顏色</label>
                        <div class="theme-buttons">
                            <button class="theme-btn" data-color="#000000">黑色</button>
                            <button class="theme-btn" data-color="#ffffff">白色</button>
                            <button class="theme-btn active" data-color="#0a84ff">藍色</button>
                            <button class="theme-btn" data-color="#27c93f">綠色</button>
                            <button class="theme-btn" data-color="#ff5f56">紅色</button>
                            <button class="theme-btn" data-color="#ffbd2e">黃色</button>
                            <button class="theme-btn" data-color="#a371f7">紫色</button>
                        </div>
                    </div>
                    <div class="setting-group">
                        <label>背景顏色</label>
                        <div class="bg-buttons">
                            <button class="bg-btn active" data-bg="#1a1a1a">深灰</button>
                            <button class="bg-btn" data-bg="#000000">黑色</button>
                            <button class="bg-btn" data-bg="#ffffff">白色</button>
                            <button class="bg-btn" data-bg="#0a2540">深藍</button>
                            <button class="bg-btn" data-bg="#1a3a1a">深綠</button>
                            <button class="bg-btn" data-bg="#3a1a1a">深紅</button>
                        </div>
                    </div>
                    <div class="setting-group">
                        <button class="btn btn-primary" id="reset-btn" style="width: 100%; justify-content: center;">
                            <i class="bi bi-arrow-clockwise"></i>
                            <span>重置位置</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/macos.js"></script>
    <script src="js/time.js"></script>
</body>

</html>
