<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="在瀏覽器整理 PDF 頁面，重新排序、合併、刪除並新增筆跡與文字註記。">
  <title>PDF 編輯器 — Hamster Yang Tools</title>
  <link rel="icon" href="../../assets/favicon.ico" sizes="any">
  <link rel="stylesheet" href="../../css/tools.css?v=20261110b">
  <link rel="stylesheet" href="css/pdf-editor.css?v=20261110b">
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js" defer></script>
  <script src="../../js/tools.js?v=20261110b" defer></script>
  <script src="js/pdf-editor.js?v=20261110b" defer></script>
</head>
<body>
  <a class="skip-link" href="#pdf-main">跳至 PDF 編輯器</a>
  <div class="desktop">
    <header class="top-bar">
      <nav class="top-bar-left" aria-label="工具導覽">
        <a class="apple-logo tool-brand" href="../../index.html" aria-label="Hamster Yang 個人桌面">hy.</a>
        <span class="menu-item tool-app-name">PDF Editor</span>
        <a href="../../index.html">返回桌面</a>
        <a href="../../projects.html">所有工具</a>
      </nav>
      <div class="top-bar-right"><time id="clock">Personal workspace</time></div>
    </header>
    <main class="pdf-window" id="pdf-main" tabindex="-1">
      <header class="pdf-header">
        <div class="window-controls" aria-label="視窗控制">
          <a href="../../index.html" class="window-control-btn close" aria-label="關閉 PDF 編輯器並返回桌面" title="返回桌面"></a>
          <span class="window-control-btn inactive" aria-hidden="true"></span><span class="window-control-btn inactive" aria-hidden="true"></span>
        </div>
        <h1 class="pdf-header-title">PDF 編輯器</h1>
        <div class="pdf-header-actions">
          <button class="btn btn-primary" id="upload-btn" type="button">＋ 匯入 PDF</button>
          <button class="btn btn-success" id="download-btn" type="button" disabled>↓ 匯出 PDF</button>
        </div>
      </header>
      <section class="pdf-content" aria-labelledby="pages-title">
        <div class="section-header"><div><h2 id="pages-title">頁面列表</h2><p>拖曳 ⠿ 或使用前移／後移調整順序。</p></div><span class="page-count" id="page-count-display" aria-live="polite">0 頁</span></div>
        <p class="privacy-note">檔案在你的瀏覽器處理，不會上傳。原文件會保留；新增註記不會移除原文。</p>
        <div id="pages-grid">
          <div class="empty-state"><span class="empty-file" aria-hidden="true">PDF</span><h3>把文件整理在一起</h3><p>匯入一份或多份 PDF，排列頁面後匯出。</p><small>不支援需密碼或加密的 PDF。</small></div>
        </div>
      </section>
      <footer class="pdf-status"><span>LOCAL PROCESSING</span><span>合併 · 排序 · 註記</span></footer>
    </main>
    <input type="file" id="file-input" multiple accept="application/pdf,.pdf" hidden aria-label="選擇 PDF 檔案">
    <noscript><p class="no-script-note">PDF 編輯需要 JavaScript。你仍可返回桌面或查看所有工具。</p></noscript>

    <dialog id="edit-modal" aria-labelledby="editor-title" aria-describedby="editor-help">
      <header class="edit-header">
        <h2 id="editor-title">編輯頁面</h2>
        <div class="edit-tools" role="group" aria-label="註記工具">
          <div class="tool-group"><button id="tool-draw" class="tool-btn active" type="button" aria-pressed="true">畫筆</button><button id="tool-text" class="tool-btn" type="button" aria-pressed="false">文字</button></div>
          <div class="tool-group"><label for="edit-color">顏色</label><input type="color" id="edit-color" value="#000000"></div>
          <div class="tool-group size-group"><label id="size-label" for="edit-size">粗細：2</label><input type="range" id="edit-size" min="1" max="64" value="2"></div>
          <button class="btn btn-danger" id="clear-edits-btn" type="button">清除註記</button>
        </div>
        <div class="edit-actions"><button class="btn" id="cancel-edit-btn" type="button">取消</button><button class="btn btn-success" id="save-edit-btn" type="button">套用註記</button></div>
      </header>
      <p id="editor-help">畫筆支援滑鼠、觸控與手寫筆。文字工具：點選頁面，或聚焦頁面後按 Enter；輸入完成按 Enter 套用，Esc 取消輸入。</p>
      <div class="edit-canvas-wrapper"><div class="edit-canvas-container"><canvas id="pdf-base-canvas" aria-hidden="true"></canvas><canvas id="pdf-edit-canvas" tabindex="0" aria-label="PDF 註記畫布；文字工具可按 Enter 開始輸入"></canvas><input type="text" id="canvas-text-input" maxlength="500" aria-label="新增註記文字" placeholder="輸入文字…" autocomplete="off"></div></div>
    </dialog>
    <div id="loading-overlay" role="status" aria-live="polite" aria-atomic="true"><div class="loading-content"><div class="loading-spinner" aria-hidden="true"></div><p id="loading-text">處理中…</p></div></div>
    <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>
</body>
</html>
